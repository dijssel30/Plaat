name: build and test

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.slnx'
    - '**.razor'

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

jobs:
  build-and-test:

    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install FFmpeg
      run: sudo apt update && sudo apt install -y ffmpeg

    - name: Install workload dependencies
      run: dotnet workload restore

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test Biz
      run: dotnet test test/Plaat.Biz.Tests --no-restore --verbosity normal

    - name: Test Contract
      run: dotnet test test/Plaat.Contract.Tests --no-restore --verbosity normal

    - name: Test Db
      run: dotnet test test/Plaat.Db.Tests --no-restore --verbosity normal

    - name: Test Frontend
      run: dotnet test test/Plaat.Frontend.Tests --no-restore --verbosity normal

    - name: Test Infrastructure
      run: dotnet test test/Plaat.Infrastructure.Tests --no-restore --verbosity normal

    - name: Test Mobile
      run: dotnet test test/Plaat.Mobile.Tests --no-restore --verbosity normal

